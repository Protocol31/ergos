name: ergos
description: Ergos - memorias vivas. Acompañamiento pastoral cifrado de extremo a extremo.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Estado y UI
  flutter_riverpod: ^2.5.1
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  intl: ^0.19.0

  # Base de datos local cifrada (SQLCipher + FTS5), mismo código en Windows y móvil
  sqlite3: ^2.4.0
  sqlcipher_flutter_libs: ^0.6.4
  path: ^1.9.0
  path_provider: ^2.1.3
  uuid: ^4.5.1

  # Criptografía (Argon2id, HKDF, AES-256-GCM). cryptography_flutter usa implementaciones nativas.
  cryptography: ^2.7.0
  cryptography_flutter: ^2.3.2
  crypto: ^3.0.3

  # Autenticación
  flutter_secure_storage: ^9.2.2   # Keystore / Keychain / DPAPI
  local_auth: ^2.3.0               # huella, rostro, Windows Hello
  otp: ^3.1.4                      # TOTP RFC 6238 (Google Authenticator, Authy...)
  qr_flutter: ^4.1.0

  # Google Drive (alcance mínimo: drive.file)
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  google_sign_in: ^6.2.1
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  url_launcher: ^6.3.0
  http: ^1.2.1

  # Consentimiento: firma, video, PDF
  signature: ^5.5.0
  camera: ^0.11.0
  camera_windows: ^0.2.5
  pdf: ^3.11.0
  printing: ^5.13.0
  file_picker: ^8.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/intro/
    - assets/legal/consentimiento_es.md
  shaders:
    - shaders/ergos_light.frag
