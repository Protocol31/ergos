name: Compilar APK de Ergos

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generar plataformas
        run: flutter create . --platforms=android --org com.ergos --project-name ergos
      - name: Ajustes de Android
        run: ./tool/patch_android.sh
      - run: flutter pub get
      - name: Análisis (informativo)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings | tee analyze.txt
        continue-on-error: true
      - name: Compilar APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ergos-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analisis
          path: app/analyze.txt
          if-no-files-found: ignore
